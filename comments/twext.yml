name: "comments"
version: "0.2.0"
description: "a commeting extension for scratchVM mods"
author: "sandisk/mc20000 jamie@sdisk.us"
license: "Apache-2.0"

entryPoint: "src/index.js"
outputPath: "dist/extension.js"

extension:
  id: "comments"
  name: "Comments"
  className: "Comments"
  color1: "#83eb34"
  color2: "#a3d94e"
  color3: "#4a6635"

blocks:
  - opcode: commentReporter
    blockType: reporter
    text: "comment [COMMENT] passthrough [PASS]"
    arguments:
      COMMENT:
        type: string
        defaultValue: "comment"
      PASS:
        type: string
        defaultValue: "pass through"
  - opcode: commentInline
    blockType: command
    text: "comment [COMMENT]"
    arguments:
      COMMENT:
        type: string
        defaultValue: "comment"
  - opcode: commentCblock
    blockType: cblock
    text: "comment [COMMENT] run? [RUN]"
    arguments:
      COMMENT:
        type: string
        defaultValue: "comment"
      RUN:
        type: boolean
        defaultValue: false
